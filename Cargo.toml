[package]
name = "parquet-viewer"
version = "0.1.3"
edition = "2024"
description = "Fast viewer and search tool for large Parquet files"
license = "MIT"
readme = "README.md"

[features]
hide-console = []

[dependencies]
datafusion = { version = "55.2.0", default-features = false, features = [
    # everything the SQL panel needs; "compression" is left out because the app
    # never reads compressed CSV/JSON/Arrow files, only Parquet
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "parquet",
    "recursive_protection",
    "sql",
] }
arrow = "59.2.0"
parquet = { version = "59.2.0", features = ["arrow", "snap", "zstd", "lz4", "flate2"] }
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
rayon = "1"
aho-corasick = "1"
sysinfo = "0.30"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# For everyday work: optimised like the release build, but fast to compile.
# Use `cargo build --profile dev-fast` instead of waiting for a fat LTO link.
[profile.dev-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
panic = "unwind"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

