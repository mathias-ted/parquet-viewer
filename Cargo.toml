[package]
name = "parquet-viewer"
version = "0.1.1"
edition = "2024"
description = "Fast viewer and search tool for large Parquet files"
license = "MIT"
readme = "README.md"

[features]
hide-console = []

[dependencies]
datafusion = "55.2.0"
arrow = "59.2.0"
parquet = { version = "59.2.0", features = ["arrow", "snap", "zstd", "lz4", "flate2"] }
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
rayon = "1"
aho-corasick = "1"
sysinfo = "0.30"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

